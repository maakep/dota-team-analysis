name: Prefetch from STRATZ and deploy

# STRATZ-powered deployment path. Runs scripts/prefetch.ts in CI to fetch
# fresh data from STRATZ, then builds and deploys to Pages — overwriting
# whatever the fallback workflow (.github/workflows/pages.yml) last
# published.
#
# IMPORTANT: STRATZ pins personal API tokens to the IP that minted them,
# so this workflow will return HTTP 403 unless either:
#   - STRATZ has whitelisted your token for multiple IPs (ask their dev
#     team), or
#   - You route the prefetch through a stable-IP proxy (see notes in
#     README.md).
# Until then, refresh data locally via `npm run refresh` and let the
# fallback workflow publish the committed JSON.
#
# The dispatcher picks the team and (optionally) tweaks the analysis
# windows/ban thresholds. Defaults match the values baked into
# lib/fetch-team-data.ts.
on:
  workflow_dispatch:
    inputs:
      team_id:
        description: "STRATZ team ID to fetch"
        required: true
        default: "2163"
        type: string
      team_window_days:
        description: "Days of team-scrim history to analyze"
        required: false
        default: "270"
        type: string
      pub_window_days:
        description: "Days of pub history to analyze"
        required: false
        default: "90"
        type: string
      ban_min_games_team:
        description: "Minimum team-scrim games for a (hero, position) ban card"
        required: false
        default: "3"
        type: string
      ban_min_games_pub:
        description: "Minimum pub games for a (hero, position) ban card"
        required: false
        default: "5"
        type: string
      top_ban_min_games:
        description: "Minimum team games for the top-priority bans list"
        required: false
        default: "3"
        type: string

# Required by actions/deploy-pages: it uses OIDC to authenticate to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Shared group with the fallback workflow so the two can't race each
# other when both happen to run around the same time.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Prefetch + build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # Fetch fresh data from STRATZ → writes data/team.json on the runner.
      # If STRATZ rejects the IP, this step fails fast and the deploy is
      # skipped, leaving the previously-published site (and the committed
      # data/team.json) untouched.
      - name: Prefetch from STRATZ
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
          TEAM_ID: ${{ inputs.team_id }}
          TEAM_WINDOW_DAYS: ${{ inputs.team_window_days }}
          PUB_WINDOW_DAYS: ${{ inputs.pub_window_days }}
          BAN_MIN_GAMES_TEAM: ${{ inputs.ban_min_games_team }}
          BAN_MIN_GAMES_PUB: ${{ inputs.ban_min_games_pub }}
          TOP_BAN_MIN_GAMES: ${{ inputs.top_ban_min_games }}
        run: npm run prefetch

      - name: Build static site
        env:
          BASE_PATH: "/dota-team-analysis"
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
