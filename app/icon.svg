<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Dota Scout">
  <!-- Rounded-square chip in the dashboard's ink-900 so the favicon
       reads as a unified shape against light or dark browser chrome. -->
  <rect width="32" height="32" rx="6" fill="#0a0c10"/>
  <!-- Target reticle in accent-flex purple (#a679f0). Concentric rings
       + cardinal tick marks + center dot. Stroke is heavy (2.5px on a
       32px canvas) so the shape survives 16×16 favicon downscaling
       without disintegrating into anti-alias mush. -->
  <g fill="none" stroke="#a679f0" stroke-width="2.5" stroke-linecap="round">
    <circle cx="16" cy="16" r="11"/>
    <circle cx="16" cy="16" r="5"/>
    <line x1="16" y1="2"  x2="16" y2="6"/>
    <line x1="16" y1="26" x2="16" y2="30"/>
    <line x1="2"  y1="16" x2="6"  y2="16"/>
    <line x1="26" y1="16" x2="30" y2="16"/>
  </g>
  <circle cx="16" cy="16" r="1.75" fill="#a679f0"/>
</svg>
